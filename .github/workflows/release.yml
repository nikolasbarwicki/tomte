name: Release

# Pushing a v* tag publishes a GitHub Release. Cut one as AGENTS.md ("Releasing") describes.
#
# verify   the tag is vMAJOR.MINOR.PATCH[-prerelease] and names the host's VERSION (scripts/release.ts tag)
# host     per target, on a native runner: build the host binary, smoke-run it, upload it as `release-host-<target>`
# publish  merges every `release-*` artifact into one folder, writes SHA256SUMS over it, creates the Release
#
# desktop  per OS, on a native runner: package the installers around the host job's own binary (no rebuild), signed and
#          (macOS) notarized when that OS's signing secrets exist, check that the host in every app is that binary, upload
#          installers + update metadata as `release-desktop-<os>`
#
# Signing (scripts/signing.ts, scripts/signing-kit.ts; AGENTS.md "Releasing"): `verify` decides per platform from which
# secrets exist; the macOS and Windows host jobs sign their binary before the smoke run; the desktop job signs the app and
# installers with the same certificate and checks the result. Without secrets the release is unsigned and says so in the
# job summary, unless the repository variable CLAUDEBOT_REQUIRE_SIGNING is `true`, which fails the release instead.
#
# Installers are released for macOS (arm64 and x64), Windows x64 and Linux x64 (scripts/desktop-kit.ts
# SUPPORTED_DESKTOP); linux-arm64 is host-only. Both macOS arches are packaged in ONE job so electron-builder writes the one
# latest-mac.yml listing both zips (two jobs would each upload a latest-mac.yml and the merge would keep one of them).
# `publish` fails unless every host binary, installer and metadata file of that list is in the folder.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A tag is released once at a time; a second run for the same tag waits instead of cancelling a publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      sign_mac: ${{ steps.signing.outputs.mac }}
      sign_windows: ${{ steps.signing.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # Fails the whole release when the tag and VERSION disagree. The tag goes through an env var, never interpolated.
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/release.ts tag "$TAG"

      # Decides, per platform, whether this release is signed, from which signing secrets exist (AGENTS.md, "Releasing"
      # lists them). Only whether each is set reaches the step, never a value. All of a platform's secrets: signed; none:
      # unsigned and the job summary says so; some: the release fails. With the repository variable
      # CLAUDEBOT_REQUIRE_SIGNING=true a platform without secrets fails the release too, before anything is built.
      - id: signing
        env:
          CLAUDEBOT_REQUIRE_SIGNING: ${{ vars.CLAUDEBOT_REQUIRE_SIGNING }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && 'set' || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' && 'set' || '' }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' && 'set' || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' && 'set' || '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' && 'set' || '' }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' && 'set' || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' && 'set' || '' }}
        run: bun scripts/signing.ts plan

  host:
    name: host ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        # Every target has a native runner, so every binary is built and smoke-run on the OS and CPU it ships for.
        # ubuntu-24.04-arm is free for public repositories only; a private repository needs a larger runner here.
        # macos-15-intel is the last GitHub-hosted Intel macOS image (offered until August 2027).
        include:
          - { target: darwin-arm64, runner: macos-15, ext: "" }
          - { target: darwin-x64, runner: macos-15-intel, ext: "" }
          - { target: linux-x64, runner: ubuntu-24.04, ext: "" }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, ext: "" }
          - { target: windows-x64, runner: windows-2025, ext: ".exe" }
    defaults:
      run:
        shell: bash
    env:
      BINARY: dist/host/claudebot-host-${{ matrix.target }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:host ${{ matrix.target }}

      # The host is signed before anything else touches it: the signed binary is what the smoke run starts (so a missing
      # entitlement fails here, under the hardened runtime), what the release publishes and what the desktop job bundles.
      # `signing.ts sign-host` refuses to run outside Actions; it uses a temporary keychain and removes it. Only the
      # step for this OS gets its secrets.
      - name: Sign host (macOS)
        if: startsWith(matrix.target, 'darwin-') && needs.verify.outputs.sign_mac == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bun scripts/signing.ts sign-host "$BINARY"

      - name: Sign host (Windows)
        if: matrix.target == 'windows-x64' && needs.verify.outputs.sign_windows == 'true'
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bun scripts/signing.ts sign-host "$BINARY"

      # Runs the binary the job just built (copied outside the repo, own temp data root); needs network for `install-cli`.
      - name: Smoke
        run: bun run smoke:host "$BINARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-host-${{ matrix.target }}
          path: ${{ env.BINARY }}
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: desktop ${{ matrix.os }}
    needs: [verify, host]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        # `archs` is what the app is packaged for; `hosts` selects the host artifacts those apps bundle; `bundle` is
        # the folder package:desktop writes (scripts/desktop-kit.ts bundleDirName).
        include:
          - {
              os: macos,
              runner: macos-15,
              archs: "arm64 x64",
              hosts: "release-host-darwin-*",
              bundle: Claudebot-darwin-arm64-x64,
            }
          - {
              os: windows,
              runner: windows-2025,
              archs: "x64",
              hosts: "release-host-windows-x64",
              bundle: Claudebot-win32-x64,
            }
          - {
              os: linux,
              runner: ubuntu-24.04,
              archs: "x64",
              hosts: "release-host-linux-x64",
              bundle: Claudebot-linux-x64,
            }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      ARCHS: ${{ matrix.archs }}
      # Whether this OS's installers are signed: the verify job's decision; Linux never is.
      SIGN: ${{ (matrix.os == 'macos' && needs.verify.outputs.sign_mac) || (matrix.os == 'windows' && needs.verify.outputs.sign_windows) || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # The release's own host binaries, as the host job smoke-ran and uploaded them (the download drops their mode).
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.hosts }}
          merge-multiple: true
          path: hosts

      # The app version is the host's VERSION, the update provider is this repository's Releases (GITHUB_REPOSITORY, set
      # by Actions), and the script fails when CI lacks it. `--host-dir` bundles the downloaded binaries instead of
      # building new ones. Signed or not is the verify job's answer for this OS (env SIGN): signed passes `--sign` and
      # this OS's secrets, and electron-builder signs the app and installers (notarizes and staples on macOS) with the
      # same certificate that signed the host; unsigned gets no secret, looks up no identity and says so in the log.
      # The secrets go to this step only, and only this OS's (the `&& … || ''` leaves the others empty).
      - name: Package
        env:
          CLAUDEBOT_REQUIRE_SIGNING: ${{ vars.CLAUDEBOT_REQUIRE_SIGNING }}
          MACOS_CERTIFICATE_P12: ${{ matrix.os == 'macos' && secrets.MACOS_CERTIFICATE_P12 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ matrix.os == 'macos' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          WINDOWS_CERTIFICATE_PFX: ${{ matrix.os == 'windows' && secrets.WINDOWS_CERTIFICATE_PFX || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ matrix.os == 'windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          read -ra archs <<< "$ARCHS"
          args=()
          for arch in "${archs[@]}"; do args+=(--arch "$arch"); done
          if [ "$SIGN" = true ]; then args+=(--sign); fi
          bun run package:desktop --out dist/desktop --host-dir hosts "${args[@]}"

      # Only a signed OS: the app, the update zip and the installer are validly signed (macOS: also notarized and stapled,
      # accepted by Gatekeeper) and the bundled host carries the app's own identity. No secret is needed to look.
      - name: Verify signing
        if: env.SIGN == 'true'
        run: |
          read -ra archs <<< "$ARCHS"
          bun scripts/signing.ts verify "dist/desktop/${{ matrix.bundle }}" "$VERSION" "${archs[@]}"

      # Fails unless the host in every app (and in the macOS update zip) is byte-identical to hosts/<binary>, the update
      # metadata names VERSION and every installer exists; then copies exactly the installers and metadata out. The host
      # is signed before the host job uploads it and electron-builder leaves it alone, so signed or not, the bytes match.
      - name: Check host and collect
        run: |
          read -ra archs <<< "$ARCHS"
          bun scripts/release.ts desktop "dist/desktop/${{ matrix.bundle }}" hosts release-desktop "$VERSION" "${archs[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.os }}
          path: release-desktop
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: [verify, host, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can write to the repository.
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      # The self-hoster's installer and its unit, so `install.sh` runs on its own. The installer's DEFAULT_REPO is
      # filled in with this repository; being in release/, both files are in SHA256SUMS (the installer checks the
      # unit against it).
      - name: Installer
        run: |
          set -euo pipefail
          sed "s|^DEFAULT_REPO=\"\"\$|DEFAULT_REPO=\"$GITHUB_REPOSITORY\"|" deploy/install.sh >release/install.sh
          grep -qxF "DEFAULT_REPO=\"$GITHUB_REPOSITORY\"" release/install.sh
          cp deploy/claudebot.service release/claudebot.service

      # Fails unless all five host binaries and every supported OS's installers and update metadata are there; covers every
      # file in release/, SHA256SUMS excluded.
      - name: Checksums
        run: bun scripts/release.ts checksums release "$VERSION"

      # A draft until every asset is uploaded, so nobody sees a half-filled Release. A rerun of a failed publish
      # replaces the assets of the Release that already exists.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --draft --title "$TAG" --generate-notes --prerelease="$PRERELEASE"
          fi
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
