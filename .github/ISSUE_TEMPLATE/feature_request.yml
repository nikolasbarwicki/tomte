name: Feature request
description: Something Tomte should do that it does not.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        For a big change (a new subsystem, a new dependency, a new integration), a [Discussion](https://github.com/nikolasbarwicki/tomte/discussions/categories/ideas) is a better first step.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way. Describe the need, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work from your side (UI, phone, server).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: dropdown
    id: help
    attributes:
      label: Would you work on it?
      options:
        - "No"
        - Yes, with some guidance
        - Yes, I have a design in mind
