changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
    authors: [dependabot, github-actions]
  categories:
    - title: Security
      labels: [security]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Docs
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
