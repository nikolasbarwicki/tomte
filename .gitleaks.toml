title = "tomte gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Fake password fixture in login.test.ts and routines.test.ts (login.test.ts's path before the packages/ move is in history)"
condition = "AND"
paths = ['''(^|/)src/browser/(login|routines)\.test\.ts$''']
regexes = ['''Zq7-correct-horse-battery''']

[[allowlists]]
description = "Password-manager names in a research table (\"1Password, Bitwarden/Vaultwarden\"), not a key"
condition = "AND"
paths = ['''(^|/)docs/research/grok-bot-alternatives/README\.md$''']
regexTarget = "line"
regexes = ['''1Password, Bitwarden/Vaultwarden''']
